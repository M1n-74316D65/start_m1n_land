<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f4f0"
      media="(prefers-color-scheme: light)"
    />
    <title>Offline - M1n Startpage</title>
    <style>
      :root {
        --color-background: #0a0a0a;
        --color-surface: #121212;
        --color-text: #eaeaea;
        --color-text-muted: #5c5c5c;
        --color-border: #2a2a2a;
        --color-accent: #e61919;
        --scanline-color: rgba(0, 0, 0, 0.12);
        --shadow-panel: 4px 4px 0 rgba(0, 0, 0, 0.8);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --color-background: #f4f4f0;
          --color-surface: #eae8e3;
          --color-text: #050505;
          --color-text-muted: #7a7972;
          --color-border: #c8c5bc;
          --color-accent: #e61919;
          --scanline-color: rgba(0, 0, 0, 0.025);
          --shadow-panel: 4px 4px 0 rgba(5, 5, 5, 0.18);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          'IBM Plex Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        background: var(--color-background);
        color: var(--color-text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          var(--scanline-color, rgba(0, 0, 0, 0.12)) 2px,
          var(--scanline-color, rgba(0, 0, 0, 0.12)) 4px
        );
      }

      .container {
        width: min(100%, 28rem);
        border: 1px solid var(--color-border);
        background: var(--color-surface);
        box-shadow: var(--shadow-panel);
      }

      .status {
        color: var(--color-accent);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-background);
      }

      .body {
        padding: 1.5rem 1rem;
      }

      h1 {
        font-size: clamp(1.35rem, 4vw, 1.75rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 0.65rem;
      }

      p {
        color: var(--color-text-muted);
        margin-bottom: 1.25rem;
        line-height: 1.5;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      button {
        font-family: inherit;
        background: transparent;
        color: var(--color-text);
        border: 1px solid var(--color-border);
        padding: 0.55rem 1rem;
        cursor: pointer;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          border-color 0.14s ease,
          color 0.14s ease,
          background 0.14s ease;
      }

      button:hover,
      button:focus-visible {
        border-color: var(--color-accent);
        color: var(--color-accent);
        background: var(--color-background);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="status">[ OFFLINE ] NET / LOST</div>
      <div class="body">
        <h1>Link down</h1>
        <p>
          Cached shortcuts remain available. Live search requires a network
          connection.
        </p>
        <button type="button" onclick="window.location.reload()">
          >>> Retry
        </button>
      </div>
    </div>
  </body>
</html>
