<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#171916"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8f8f4"
      media="(prefers-color-scheme: light)"
    />
    <title>Offline — M1n Startpage</title>
    <style>
      :root {
        --color-background: #171916;
        --color-surface: #22251f;
        --color-text: #f0f1e9;
        --color-text-muted: #a0a995;
        --color-border: #414839;
        --color-accent: #c0d59b;
        --color-accent-foreground: #171916;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --color-background: #f8f8f4;
          --color-surface: #eeefe8;
          --color-text: #242820;
          --color-text-muted: #5e6755;
          --color-border: #d5d9cd;
          --color-accent: #465c2e;
          --color-accent-foreground: #f8f8f4;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          'Outfit',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--color-background);
        color: var(--color-text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .container {
        width: min(100%, 28rem);
        border: 1px solid var(--color-border);
        background: var(--color-surface);
      }

      .status {
        color: var(--color-accent);
        font-family:
          'IBM Plex Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-background);
      }

      .body {
        padding: 1.5rem 1.25rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
      }

      p {
        color: var(--color-text-muted);
        margin-bottom: 1.5rem;
        line-height: 1.5;
        font-size: 0.9375rem;
      }

      button {
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        background: var(--color-accent);
        color: var(--color-accent-foreground);
        border: 1px solid var(--color-accent);
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="status">m1n / offline</div>
      <div class="body">
        <h1>You are offline</h1>
        <p>
          Cached shortcuts remain available. Live search and Wire headlines
          require a network connection.
        </p>
        <button type="button" onclick="window.location.reload()">Retry</button>
      </div>
    </div>
  </body>
</html>
