<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f4f0"
      media="(prefers-color-scheme: light)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M1n" />
    <meta name="application-name" content="M1n Startpage" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon-192.png"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>M1n Startpage</title>
  </head>
  <body>
    <main>
      <section class="zone zone-header" aria-label="Workspace">
        <div class="zone-label" aria-hidden="true">
          <span>[ WORKSPACE ]</span>
          <span class="zone-label-id" id="workspace-unit">UNIT / WS-01</span>
        </div>
        <tabs-component></tabs-component>
      </section>
      <section class="zone zone-moment" aria-label="Time">
        <div class="zone-label" aria-hidden="true">
          <span>[ SYS.TIME ]</span>
          <span class="zone-label-id">REV 2.0</span>
        </div>
        <div class="zone-moment-body">
          <clock-component></clock-component>
          <div id="search-affordance"></div>
        </div>
      </section>
      <section class="zone zone-actions" aria-label="Shortcuts">
        <div class="zone-label" aria-hidden="true">
          <span>[ OPS / SHORTCUTS ]</span>
          <span class="zone-label-id">GRID</span>
        </div>
        <commands-component></commands-component>
      </section>
      <section class="zone zone-news" aria-label="Hacker News">
        <div class="zone-label" aria-hidden="true">
          <span>[ FEED / HN ]</span>
          <span class="zone-label-id">NET</span>
        </div>
        <newsfeed-component></newsfeed-component>
      </section>
    </main>
    <span class="offline-badge" aria-live="polite">[ OFFLINE ]</span>
    <search-component></search-component>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
