<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M1n" />
    <meta name="application-name" content="M1n Startpage" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon-192.png"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>M1n Startpage</title>
  </head>
  <body>
    <main>
      <section class="zone zone-header" aria-label="Workspace">
        <tabs-component></tabs-component>
      </section>
      <section class="zone zone-moment" aria-label="Time">
        <clock-component></clock-component>
        <div id="search-affordance"></div>
      </section>
      <section class="zone zone-actions" aria-label="Shortcuts">
        <commands-component></commands-component>
      </section>
      <section class="zone zone-news" aria-label="Hacker News">
        <newsfeed-component></newsfeed-component>
      </section>
    </main>
    <search-component></search-component>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
