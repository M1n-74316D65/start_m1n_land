<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#171916"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f8f8f4"
      media="(prefers-color-scheme: light)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M1n" />
    <meta name="application-name" content="M1n Startpage" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon-192.png"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>M1n Startpage</title>
  </head>
  <body>
    <main>
      <header class="zone zone-header">
        <h1 class="brand">
          m1n
          <span>/ start</span>
        </h1>
        <tabs-component></tabs-component>
      </header>
      <section class="zone zone-moment" aria-label="Time and search">
        <div class="zone-moment-body">
          <clock-component></clock-component>
          <div id="search-affordance"></div>
        </div>
      </section>
      <section class="zone zone-actions" aria-label="Shortcuts">
        <commands-component></commands-component>
      </section>
      <section class="zone zone-news" aria-label="Hacker News">
        <newsfeed-component></newsfeed-component>
      </section>
    </main>
    <span class="offline-badge" aria-live="polite">Offline</span>
    <search-component></search-component>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
